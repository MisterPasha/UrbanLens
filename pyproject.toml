[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "urbanlens"
version = "0.1.0"
description = "Public hospitality location research for Brighton & Hove"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "mangum==0.22.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "python-dotenv>=1.2.2,<2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
pipeline = [
    "dbt-core==1.12.6",
    "dbt-postgres==1.11.0",
    "openpyxl==3.1.5",
    "pyproj==3.8.0",
    "shapely==2.2.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
urbanlens = "urbanlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanlens"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["database: requires the local Docker PostGIS service"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "shapely.*"]
ignore_missing_imports = true

[tool.uv]
required-version = "==0.13.6"
